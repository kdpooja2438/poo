name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Terraform init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform plan
        working-directory: ./terraform
        run: terraform plan

      - name: Run Checkov (IaC security scan)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ./terraform
          framework: terraform
          soft_fail: true

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks (scan for committed secrets)
        run: gitleaks detect --source . --verbose

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build backend
        working-directory: ./backend
        run: |
          for attempt in 1 2 3; do
            mvn -B clean package -DskipTests && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "Maven download/build attempt $attempt failed; retrying..."
              sleep $((attempt * 20))
            fi
          done
          exit 1

      - name: Run backend tests
        working-directory: ./backend
        run: mvn -B test

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build backend Docker image
        run: docker build -t hotel-backend:${{ github.sha }} ./backend

      - name: Build frontend Docker image
        run: docker build -t hotel-frontend:${{ github.sha }} ./frontend

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hotel-backend:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hotel-frontend:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Grep check - no .env files committed
        run: |
          matches=$(find . -name "*.env" -not -path "*/node_modules/*" -not -path "*/.git/*")
          if [ -n "$matches" ]; then
            echo "Found .env file(s) that should not be committed:"
            echo "$matches"
            exit 1
          fi
          echo "No .env files found."

      - name: Grep check - obvious hardcoded credential patterns
        run: |
          echo "This is a naive, advisory-only text search - see explanation for its limits."
          grep -rEn "(password|passwd|secret|api_key)\s*=\s*['\"][^'\"]{3,}['\"]" \
            --include="*.java" --include="*.properties" --include="*.yml" --include="*.ts" \
            --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=target --exclude-dir=.git . \
            | grep -v '\${' || echo "No obvious hardcoded credential patterns found."
