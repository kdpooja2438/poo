name: Self-hosted runner verification

on:
  workflow_dispatch:

jobs:
  verify-runner:
    runs-on: [self-hosted, windows, x64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner details
        shell: cmd
        run: |
          echo Runner name: %RUNNER_NAME%
          echo Operating system: %RUNNER_OS%
          echo Architecture: %RUNNER_ARCH%
          echo Machine: %COMPUTERNAME%
          echo Workspace: %GITHUB_WORKSPACE%

      - name: Verify repository checkout
        shell: cmd
        run: |
          if not exist "%GITHUB_WORKSPACE%\README.md" exit /b 1
          echo Checked out repository on the self-hosted runner.
