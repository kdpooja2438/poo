apiVersion: apps/v1
kind: Deployment
metadata:
	name: backend
	namespace: hotel
spec:
	replicas: 1
	selector:
		matchLabels:
			app: backend
	template:
		metadata:
			labels:
				app: backend
		spec:
			containers:
				- name: backend
					image: hotel-backend:latest
					imagePullPolicy: Never
					ports:
						- containerPort: 8081
					envFrom:
						- configMapRef:
								name: backend-config
					env:
						- name: DB_USER
							valueFrom:
								secretKeyRef:
									name: postgres-secret
									key: POSTGRES_USER
						- name: DB_PASSWORD
							valueFrom:
								secretKeyRef:
									name: postgres-secret
									key: POSTGRES_PASSWORD
					readinessProbe:
						httpGet:
							path: /api/rooms
							port: 8081
						initialDelaySeconds: 20
						periodSeconds: 10
					livenessProbe:
						httpGet:
							path: /api/rooms
							port: 8081
						initialDelaySeconds: 40
						periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
	name: backend
	namespace: hotel
spec:
	selector:
		app: backend
	ports:
		- port: 8081
			targetPort: 8081
