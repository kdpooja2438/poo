<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="fw-bold mb-0">Room Management</h2>
  <button type="button" class="btn btn-primary" (click)="openAddForm()">
    <i class="bi bi-plus-lg me-1"></i> Add Room
  </button>
</div>

<div class="alert alert-danger" *ngIf="loadError">{{ loadError }}</div>

<div class="card border-0 shadow-sm">
  <div class="card-body">
    <div class="table-responsive">
      <table class="table align-middle">
        <thead>
          <tr>
            <th>Room No</th>
            <th>Room Type</th>
            <th>Price</th>
            <th>Status</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let room of rooms">
            <td>{{ room.roomNumber }}</td>
            <td>{{ room.roomType }}</td>
            <td>₹{{ room.price }}</td>
            <td>
              <span
                class="badge rounded-pill"
                [class.text-bg-success]="room.status === 'AVAILABLE'"
                [class.text-bg-danger]="room.status === 'OCCUPIED'"
                [class.text-bg-warning]="room.status === 'MAINTENANCE'"
              >
                {{ room.status }}
              </span>
            </td>
            <td class="text-end">
              <button type="button" class="btn btn-sm btn-outline-primary me-2" (click)="openEditForm(room)">
                <i class="bi bi-pencil-square"></i> Edit
              </button>
              <button type="button" class="btn btn-sm btn-outline-danger" (click)="deleteRoom(room)">
                <i class="bi bi-trash"></i> Delete
              </button>
            </td>
          </tr>
          <tr *ngIf="rooms.length === 0">
            <td colspan="5" class="text-center text-secondary py-4">No rooms yet. Add your first room.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<app-room-form
  *ngIf="isFormOpen"
  [room]="editingRoom"
  (save)="saveRoom($event)"
  (cancel)="closeForm()"
/>
