<div class="login-page d-flex">
  <div class="brand-panel d-none d-md-flex flex-column justify-content-center align-items-center text-white">
    <div class="brand-icon mb-3">🏨</div>
    <h1 class="fw-bold">Grand Stay Hotel</h1>
    <p class="lead text-center px-4">Welcome to Grand Stay &mdash; manage rooms and bookings with ease.</p>
  </div>

  <div class="form-panel d-flex flex-column justify-content-center align-items-center flex-grow-1">
    <div class="login-card">
      <div class="text-center mb-4">
        <div class="fs-1">🏨</div>
        <h2 class="fw-bold mb-1">Grand Stay Hotel</h2>
        <p class="text-secondary mb-0">Welcome Back!</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input
            id="email"
            type="email"
            class="form-control"
            formControlName="email"
            placeholder="you@example.com"
            [class.is-invalid]="email.invalid && email.touched"
          />
          <div class="invalid-feedback" *ngIf="email.invalid && email.touched">
            <span *ngIf="email.errors?.['required']">Email is required.</span>
            <span *ngIf="email.errors?.['email']">Enter a valid email address.</span>
          </div>
        </div>

        <div class="mb-2">
          <label for="password" class="form-label">Password</label>
          <div class="input-group">
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              class="form-control"
              formControlName="password"
              placeholder="Enter your password"
              [class.is-invalid]="password.invalid && password.touched"
            />
            <button
              type="button"
              class="btn btn-outline-secondary"
              (click)="togglePasswordVisibility()"
              tabindex="-1"
            >
              <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword"></i>
            </button>
            <div class="invalid-feedback" *ngIf="password.invalid && password.touched">
              <span *ngIf="password.errors?.['required']">Password is required.</span>
              <span *ngIf="password.errors?.['minlength']">Password must be at least 4 characters.</span>
            </div>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check">
            <input
              id="rememberMe"
              type="checkbox"
              class="form-check-input"
              formControlName="rememberMe"
            />
            <label for="rememberMe" class="form-check-label">Remember me</label>
          </div>
          <a href="javascript:void(0)" class="small">Forgot password?</a>
        </div>

        <div class="alert alert-danger py-2" *ngIf="loginError">{{ loginError }}</div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="isSubmitting">
          <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-2"></span>
          Login
        </button>
      </form>
    </div>
  </div>
</div>
