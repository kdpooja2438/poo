<div class="modal-backdrop-custom">
  <div class="modal-box card border-0 shadow">
    <div class="card-body">
      <h5 class="fw-bold mb-3">{{ isEditMode ? 'Edit Room' : 'Add Room' }}</h5>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <div class="mb-3">
          <label class="form-label">Room Number</label>
          <input type="text" class="form-control" formControlName="roomNumber" />
        </div>

        <div class="mb-3">
          <label class="form-label">Room Type</label>
          <input type="text" class="form-control" formControlName="roomType" placeholder="Single / Deluxe / Suite" />
        </div>

        <div class="mb-3">
          <label class="form-label">Price (₹)</label>
          <input type="number" class="form-control" formControlName="price" />
        </div>

        <div class="mb-4">
          <label class="form-label">Status</label>
          <select class="form-select" formControlName="status">
            <option *ngFor="let s of statuses" [value]="s">{{ s }}</option>
          </select>
        </div>

        <div class="d-flex justify-content-end gap-2">
          <button type="button" class="btn btn-outline-secondary" (click)="cancel.emit()">Cancel</button>
          <button type="submit" class="btn btn-primary">{{ isEditMode ? 'Save Changes' : 'Add Room' }}</button>
        </div>
      </form>
    </div>
  </div>
</div>
