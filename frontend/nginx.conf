server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Angular is a single-page app: any route that isn't a real file
    # (e.g. /dashboard, /rooms) should still return index.html, and
    # Angular's own router takes over from there in the browser.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # "backend" resolves through Docker Compose or Kubernetes Service DNS.
    location /api/ {
        proxy_pass http://backend:8081;
    }
}
