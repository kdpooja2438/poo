server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Angular is a single-page app: any route that isn't a real file
    # (e.g. /dashboard, /rooms) should still return index.html, and
    # Angular's own router takes over from there in the browser.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Anything under /api/ is sent to the backend container instead of
    # being treated as a static file. "backend" here is resolved using
    # Docker's own DNS - it only works because both containers are on
    # the same Docker network and the backend container is named "backend".
    #
    # Using a variable ($backend_upstream) instead of a bare hostname makes
    # nginx re-resolve that DNS lookup periodically (every 10s here) instead
    # of once at startup. Without this, if the backend container restarts
    # and gets a new internal IP, nginx keeps using the old, dead IP until
    # nginx itself is restarted - causing a 502 Bad Gateway.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        proxy_pass http://backend:8080;
    }
}
